<style>
/* Layout: full-screen toon city; illustrated character left of center; nav bottom-left; text column on the right over a soft scrim. Single dark look by choice. */
:root{
  --bg:#0b0a1a; --ink:#f4effc; --dim:#aaa4cc; --faint:#6f6992; --line:rgba(244,239,252,.18);
  --accent:#5ec8ff; --amber:#ffb43a; --key:#ff7aa6; --str:#c5f28c; --num:#ffcf6b;
  --scrim:8,6,22;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:13px;line-height:1.62;overflow:hidden;-webkit-font-smoothing:antialiased}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;background:linear-gradient(#1a0b3a,#7a2a86)}
.vig{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(120% 90% at 40% 45%,transparent 55%,rgba(6,4,18,.55) 100%)}
.scrim{position:fixed;inset:0;pointer-events:none;z-index:3;background:linear-gradient(to left,rgba(var(--scrim),.82) 0%,rgba(var(--scrim),.6) 30%,rgba(var(--scrim),.0) 58%)}
.brand{position:fixed;left:44px;top:calc(34px + env(safe-area-inset-top,0px));z-index:6;pointer-events:none}
.brand b{display:block;font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.16em;line-height:1.1}
.brand span{font-size:11px;color:var(--dim);letter-spacing:.02em}

nav{position:fixed;left:44px;bottom:calc(52px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;flex-direction:column;gap:0}
nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:0;font-family:var(--display);font-weight:700;font-size:23px;line-height:1.38;letter-spacing:.03em;text-transform:uppercase;color:rgba(244,239,252,.62);text-shadow:0 1px 8px rgba(0,0,0,.5);transition:color .35s,font-size .45s cubic-bezier(.2,.7,.2,1)}
nav button i{font-style:normal;font-family:var(--mono);font-size:10px;width:48px;color:var(--faint);font-weight:500}
nav button .bar{display:inline-block;height:2px;width:0;background:var(--accent);margin-right:0;transition:width .45s cubic-bezier(.2,.7,.2,1),margin .45s}
nav button:hover{color:var(--ink)}
nav button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
nav button.on{color:var(--ink);font-size:44px;line-height:1.12}
nav button.on i{color:var(--accent)}
nav button.on .bar{width:30px;margin-right:14px}

#panel{position:fixed;right:44px;top:50%;transform:translateY(-50%);width:min(620px,40vw);max-height:80vh;overflow:auto;z-index:6;padding:4px 8px 4px 0;scrollbar-width:thin;scrollbar-color:rgba(244,239,252,.25) transparent;text-shadow:0 1px 3px rgba(0,0,0,.55)}
.head{display:flex;align-items:center;gap:12px;font-size:11px;color:var(--dim)}
.head .n{color:var(--accent);font-weight:600}
.head .rule{flex:1;height:1px;background:var(--line)}
.head kbd{font:inherit;font-size:10px;border:1px solid var(--line);padding:0 5px;border-radius:3px;color:var(--faint)}
.head button{all:unset;cursor:pointer;color:var(--dim)}
.head button:hover{color:var(--ink)}
.eyebrow{font-size:12px;color:var(--dim);margin-top:10px}
h1,h2{font-family:var(--display);font-weight:900;text-transform:uppercase;line-height:.86;margin:8px 0 14px;letter-spacing:.005em}
h1{font-size:clamp(70px,8.2vw,132px)}
h2{font-size:clamp(56px,6vw,96px)}
.word{display:inline-block;overflow:hidden;vertical-align:top;padding:.16em 0 .04em;margin-top:-.16em;white-space:nowrap}
.word>span{display:inline-block}
.role{font-weight:600;font-size:17px;color:var(--accent)}
p{margin:0 0 10px}
.dim{color:var(--dim)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn{all:unset;cursor:pointer;background:var(--amber);color:#1b1026;font-weight:600;padding:10px 16px;border-radius:2px;letter-spacing:.02em;text-shadow:none;transition:transform .2s,filter .2s}
.btn.ghost{background:rgba(244,239,252,.06);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn:focus-visible,.chip:focus-visible,.arrow:focus-visible,a:focus-visible,.head button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.code{margin:6px 0 0;font-size:12.6px}
.cl{display:grid;grid-template-columns:30px minmax(0,1fr);gap:0}
.cl .g{color:var(--faint);font-size:11px;user-select:none;padding-top:1px}
.cl .t{min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
.cl .t.in1{padding-left:2ch;text-indent:0}
.c-k{color:var(--key)}.c-n{color:var(--ink);font-weight:600}.c-p{color:var(--accent)}.c-s{color:var(--str)}.c-c{color:var(--faint)}.c-d{color:var(--num)}
.meter{letter-spacing:-1px;color:var(--accent)}
.meter u{text-decoration:none;color:rgba(244,239,252,.18)}
.tabs{display:flex;flex-wrap:wrap;gap:4px 16px;margin:6px 0 14px}
.chip{all:unset;cursor:pointer;padding:3px 0;color:var(--faint);font-size:12px;border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
.chip:hover{color:var(--ink)}
.chip.on{color:var(--ink);border-color:var(--accent)}
.stack{display:flex;flex-wrap:wrap;gap:4px 0;margin:12px 0 4px;color:var(--accent);font-size:12.5px}
.stack span+span::before{content:"/";color:var(--faint);margin:0 9px}
ul.tl{margin:0 0 6px;padding:0;list-style:none;display:grid;gap:7px}
ul.tl li{padding-left:16px;position:relative}
ul.tl li::before{content:"–";position:absolute;left:0;color:var(--accent)}
.co{font-family:var(--display);font-weight:800;font-size:30px;text-transform:uppercase;color:var(--accent);line-height:1;margin-top:4px}
.shot{border-radius:4px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.45),0 0 0 1px var(--line);margin:4px 0 12px;background:#0e0c22}
.shot .bar{display:flex;gap:6px;padding:8px 10px;align-items:center;font-size:11px;color:var(--dim);background:rgba(255,255,255,.04)}
.shot .bar u{width:7px;height:7px;border-radius:50%;background:rgba(244,239,252,.2);display:block}
.shot canvas{display:block;width:100%;height:auto;aspect-ratio:16/8;max-width:100%}
.pager{display:flex;align-items:center;gap:12px;margin:2px 0 10px;color:var(--dim);font-size:12px}
.arrow{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--line);border-radius:2px;transition:color .2s,box-shadow .2s}
.arrow:hover{color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.rows{display:grid;gap:12px}
.rows .r{display:grid;gap:1px}
.rows b{font-weight:600}
.k{color:var(--dim);font-size:11px}
a{color:var(--accent);text-underline-offset:3px;text-decoration-color:rgba(94,200,255,.5)}
a:hover{text-decoration-color:var(--accent)}
.cmd{color:var(--dim);font-size:11.5px}

/* reveal / exit */
.ln{will-change:transform,opacity}
#panel.in .ln{animation:lnIn 1.05s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--d,0) * 42ms + 80ms)}
#panel.in .word>span{animation:wIn 1s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--d,0) * 45ms)}
#panel.out .ln,#panel.out .word>span{transition:opacity .5s ease,transform .6s ease,filter .5s;opacity:0;transform:translateY(-6px);filter:blur(5px);transition-delay:calc(var(--d,0) * 10ms)}
@keyframes lnIn{from{opacity:0;transform:translateY(10px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes wIn{from{opacity:0;transform:translateY(70%)}to{opacity:1;transform:none}}

/* shutter transition */
#wipe{position:fixed;inset:0;z-index:8;pointer-events:none;display:flex}
#wipe div{flex:1;height:100%;transform:scaleY(0);transform-origin:top;background:var(--c1,#1a0b3a);box-shadow:inset 0 -3px 0 var(--accent)}
#wipe.cover div{transform:scaleY(1);transition:transform .46s cubic-bezier(.7,0,.3,1);transition-delay:calc(var(--i) * 55ms)}
#wipe.open div{transform:scaleY(0);transform-origin:bottom;box-shadow:inset 0 3px 0 var(--accent);transition:transform .56s cubic-bezier(.7,0,.3,1);transition-delay:calc(var(--i) * 55ms)}

.hints{position:fixed;right:44px;bottom:calc(26px + env(safe-area-inset-bottom,0px));z-index:6;font-size:11px;color:var(--dim);display:flex;gap:22px;align-items:center;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.hints button{all:unset;cursor:pointer;padding:2px}
.hints button.on{color:var(--accent);font-weight:600}
#load{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:var(--bg);transition:opacity .8s ease .1s}
#load.done{opacity:0;pointer-events:none}
#load div{font-family:var(--display);font-weight:800;letter-spacing:.2em;font-size:18px;color:var(--dim)}
#load div span{color:var(--accent)}
.fallback{position:fixed;inset:0;background:radial-gradient(80% 60% at 30% 70%,#3a1a6a,#0b0a1a)}

@media (max-width:820px){
  body{font-size:12.5px}
  .brand{left:16px;top:calc(18px + env(safe-area-inset-top,0px))}
  .scrim{background:linear-gradient(to top,rgba(var(--scrim),.9) 0%,rgba(var(--scrim),.75) 38%,rgba(var(--scrim),0) 62%)}
  nav{left:0;right:0;bottom:auto;top:calc(58px + env(safe-area-inset-top,0px));flex-direction:row;gap:14px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{font-size:15px;white-space:nowrap}
  nav button i,nav button .bar{display:none}
  nav button.on{font-size:15px;color:var(--accent)}
  #panel{left:16px;right:16px;width:auto;top:auto;bottom:calc(44px + env(safe-area-inset-bottom,0px));transform:none;max-height:50vh;padding:0}
  h1{font-size:62px} h2{font-size:52px}
  .hints{left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));justify-content:space-between}
  .hints .kb{display:none}
}
@media (prefers-reduced-motion:reduce){
  #panel.in .ln,#panel.in .word>span{animation:none}
  #wipe.cover div,#wipe.open div{transition-duration:.01s;transition-delay:0s}
  nav button,nav button .bar{transition:none}
}
</style>

/* sculpted car hull: lofted superellipse sections along x */
const HULL = (() => {
  const FW = 1.45, RW = -1.42, AR = .45, WY = .36;
  const cr = (pts, x) => { // monotone-ish Catmull-Rom through [x,y] keys (x descending order not required)
    const P = pts.slice().sort((a, b) => a[0] - b[0]); if (x <= P[0][0]) return P[0][1]; if (x >= P[P.length - 1][0]) return P[P.length - 1][1];
    let i = 0; while (x > P[i + 1][0]) i++;
    const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(P.length - 1, i + 2)], t = (x - p1[0])/(p2[0] - p1[0]);
    const m1 = (p2[1] - p0[1])/(p2[0] - p0[0])*(p2[0] - p1[0]), m2 = (p3[1] - p1[1])/(p3[0] - p1[0])*(p2[0] - p1[0]);
    const t2 = t*t, t3 = t2*t; return (2*t3 - 3*t2 + 1)*p1[1] + (t3 - 2*t2 + t)*m1 + (-2*t3 + 3*t2)*p2[1] + (t3 - t2)*m2;
  };

  const BOT = [[2.36, .26], [2.2, .22], [-2.2, .22], [-2.36, .3]];
  const bump = (x, c, w) => { const d = (x - c)/w; return Math.abs(d) < 1 ? .5 + .5*Math.cos(d*Math.PI) : 0; };
  const sst = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a)/(b - a))); return t*t*(3 - 2*t); };

});

/* 6 · CONTATO — sitting on the rooftop edge at sunset */
zone({
  sky:["#2a1454", "#ff8a52", "#4a1d5c"], sunDir:[.12, .02, 1], sunCol:"#ffc27a", sunK:1.0, fog:["#d9705e", 60, 360], stars:.15,
  hemi:["#ffd8c8", "#3a1f4a", 1.0], light:{pos:[10, 12, 60], color:"#ffb880", i:.7}, tint:0xfff0ea,

  cam:{p:[-.8, 1.35, -4.1], l:[.3, .35, 10]}, entry:{p:[-2, 2.2, -3], l:[0, -.6, 0]}, sway:.1,

    acu(-3.5, -3.2); acu(2.6, -4.6);
    cyl(g, 1, 1, 2.2, "#7a72b8", 5.2, -.1, -6, 16); const ant = cyl(g, .04, .06, 4.5, "#2e2856", -6, 1, -3.5, 6); void ant;
    z.blink = new THREE.Mesh(new THREE.SphereGeometry(.09, 8, 6), new THREE.MeshBasicMaterial({color:0xff3b4a})); z.blink.position.set(-6, 3.3, -3.5); g.add(z.blink);
    z.blinkGlow = glow(g, 0xff3b4a, 1.2, -6, 3.3, -3.5, .8);

    // neighbour building with neon sign
    const nb = new THREE.Group(); nb.position.set(-9.5, 0, 17); g.add(nb);

    const nm = new THREE.Mesh(new THREE.PlaneGeometry(6, 1.5), new THREE.MeshBasicMaterial({map:neon, transparent:true, fog:false})); nm.position.set(0, -2.2, -5.1); nm.rotation.y = Math.PI; nb.add(nm);

    const sunD = new THREE.Mesh(new THREE.CircleGeometry(26, 48), new THREE.MeshBasicMaterial({color:0xffd9a0, fog:false})); sunD.position.set(80, -10, 700); sunD.rotation.y = Math.PI; g.add(sunD);

/* ================= CAMERA, DISSOLVE TRANSITIONS, UI ================= */
const nav = document.getElementById("nav"), loadEl = document.getElementById("load");
let prev = 0, zi = 0, mobile = false, mx = 0, my = 0, smx = 0, smy = 0, queued = null;
let trans = null;                                   // {from, to, p}
const TRANS_DUR = REDUCED ? .5 : 1.9;
const tmpP = V3(0, 0, 0), tmpL = V3(0, 0, 0), wp = V3(0, 0, 0);
const easeOut = x => 1 - Math.pow(1 - x, 3), easeInOut = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3)/2;

/* composite pass: two scenes blended with a soft, cloudy dissolve */
let rtA = null, rtB = null, post = null;
function makeRT(w, h){
  const RT = renderer.capabilities.isWebGL2 && THREE.WebGLMultisampleRenderTarget ? THREE.WebGLMultisampleRenderTarget : THREE.WebGLRenderTarget;
  const r = new RT(w, h, {minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter, format:THREE.RGBAFormat}); if (r.samples !== undefined) r.samples = 4; return r;
}
function initPost(){
  const mat = new THREE.ShaderMaterial({
    uniforms:{tA:{value:null}, tB:{value:null}, p:{value:0}, time:{value:0}, aspect:{value:1}, dirX:{value:1}},
    vertexShader:"varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }",
    fragmentShader:[
      "uniform sampler2D tA; uniform sampler2D tB; uniform float p; uniform float time; uniform float aspect; uniform float dirX; varying vec2 vUv;",
      "float hash(vec2 q){ return fract(sin(dot(q, vec2(127.1, 311.7))) * 43758.5453); }",
      "float noise(vec2 q){ vec2 i = floor(q), f = fract(q); f = f*f*(3.0 - 2.0*f); return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y); }",
      "float fbm(vec2 q){ float v = 0.0, a = 0.5; for (int i = 0; i < 5; i++){ v += a*noise(q); q *= 2.03; a *= 0.5; } return v; }",
      "void main(){",
      "  vec2 c = vec2(0.5);",
      "  vec2 uvA = c + (vUv - c) * (1.0 - 0.05*p);",
      "  vec2 uvB = c + (vUv - c) * (0.95 + 0.05*p);",
      "  vec4 A = texture2D(tA, uvA); vec4 B = texture2D(tB, uvB);",
      "  float n = fbm(vec2(vUv.x*aspect, vUv.y)*2.4 + vec2(time*0.04, -time*0.03));",
      "  float sweep = dirX > 0.0 ? vUv.x : 1.0 - vUv.x;",
      "  float v = n*0.6 + sweep*0.22 + (1.0 - vUv.y)*0.08;",
      "  float m = smoothstep(v - 0.22, v + 0.22, p*1.5 - 0.25);",
      "  float edge = 1.0 - abs(m*2.0 - 1.0);",
      "  vec3 col = mix(A.rgb, B.rgb, m) + vec3(1.0, 0.82, 0.95) * pow(edge, 3.0) * 0.10;",
      "  gl_FragColor = vec4(col, 1.0);",
      "}"].join("\n"),
    depthTest:false, depthWrite:false
  });
  const q = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat); q.frustumCulled = false;
  const s = new THREE.Scene(); s.add(q);
  post = {scene:s, cam:new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1), mat};
}

function applyEnv(z){
  const u = skyMat.uniforms; u.top.value.set(z.sky[0]); u.mid.value.set(z.sky[1]); u.bot.value.set(z.sky[2]); u.sunDir.value.set(...z.sunDir); u.sunCol.value.set(z.sunCol); u.sunK.value = z.sunK;
  scene.fog.color.set(z.fog[0]); scene.fog.near = z.fog[1]; scene.fog.far = z.fog[2];
  starMat.opacity = z.stars; stars.visible = z.stars > 0;
  hemi.color.set(z.hemi[0]); hemi.groundColor.set(z.hemi[1]); hemi.intensity = z.hemi[2]*.62;
  sun.color.set(z.light.color); sun.intensity = z.light.i; sun.position.set(...z.light.pos);
  ZONES.forEach(o => { if (o.g) o.g.visible = o === z; });
}
function enterCam(z){
  const k = REDUCED ? 0 : .7;
  z.from = {p:V3(...z.cam.p).add(V3(...z.entry.p).multiplyScalar(k)), l:V3(...z.cam.l).add(V3(...z.entry.l).multiplyScalar(k))};
  z.camT = 0; z.exitT = -1;
}
function zoneCam(z, dt){
  if (z.camT < 1) z.camT = Math.min(1, z.camT + dt/2.6);
  const e = easeOut(z.camT);
  tmpP.set(...z.cam.p); tmpL.set(...z.cam.l);
  if (z.from){ tmpP.lerpVectors(z.from.p, tmpP.clone(), e); tmpL.lerpVectors(z.from.l, tmpL.clone(), e); }
  if (z.exitT >= 0){ z.exitT = Math.min(1, z.exitT + dt/TRANS_DUR); const k = z.exitT*z.exitT; tmpP.lerp(tmpL, .22*k); tmpP.y += .25*k; }
  if (mobile) tmpP.sub(tmpL).multiplyScalar(1.22).add(tmpL);
  const sw = REDUCED ? 0 : z.sway, t = T0;
  camera.position.set(tmpP.x + Math.sin(t*.23)*sw + smx*.35, tmpP.y + Math.sin(t*.31)*sw*.45 - smy*.18, tmpP.z + Math.cos(t*.19)*sw*.4);
  camera.lookAt(tmpL);
}
function tickZone(z, dt){
  for (const m of z.movers){ const o = m.obj.position, L = m.max - m.min; o[m.axis] += m.speed*dt*SP;
    if (m.speed > 0 && o[m.axis] > m.max) o[m.axis] -= L; else if (m.speed < 0 && o[m.axis] < m.min) o[m.axis] += L; }
  if (z.update) z.update(T0, dt, z);
  if (z.signAnim !== undefined && z.signAnim < 1){ z.signAnim = Math.min(1, z.signAnim + dt/1.1); z.sign.position.x = 16*(1 - easeOut(z.signAnim)); }
  z.t += dt;
  animateSprite(z);
}
function animateSprite(z){
  if (z.robot){ let opt = {};
    if (z.sprite.robot.mode === "ride"){ const v = Math.abs(z.speed || 0), acc = z.acc || 0; z.lean = (z.lean || 0) + ((Math.max(-.14, Math.min(.14, acc*.025))) - (z.lean || 0))*.1;
      opt = {lean:z.lean, bump:(v > .2 ? Math.sin(z.t*15)*3 : Math.sin(z.t*1.6)*1)}; }
    z.robot.update(z.t, opt); return; }
  if (z.rig && z.rig.rg){ const pl = z.hero.plane, off = z.sprite.off; pl.position.set(off[0], off[1], 0); pl.rotation.z = 0; pl.scale.set(1, 1, 1);
    let opt = {};
    if (z.rig.rg === "ride"){ const v = Math.abs(z.speed || 0), a = z.acc || 0; z.lean = (z.lean || 0) + ((Math.max(-.14, Math.min(.14, a*.025))) - (z.lean || 0))*.1;
      opt = {lean:z.lean, speed:v/7, bump:(v > .2 ? Math.sin(z.t*15)*3 : Math.sin(z.t*1.6)*1)}; }
    RG.draw(z.rig.ctx, z.rig.rg, z.t, opt); z.rig.tex.needsUpdate = true; return; }
  if (z.rig){ const pl = z.hero.plane, off = z.sprite.off; pl.position.set(off ? off[0] : 0, off ? off[1] : z.sprite.planeH/2, 0); pl.rotation.z = 0; pl.scale.set(1, 1, 1);
    let opt;
    if (z.rig.key === "ride"){ const v = Math.abs(z.speed || 0), a = z.acc || 0; z.lean = (z.lean || 0) + ((Math.max(-.14, Math.min(.14, a*.025))) - (z.lean || 0))*.1;
      opt = {lean:z.lean, bump:(v > .2 ? Math.sin(z.t*15)*4 : Math.sin(z.t*1.6)*1.5)}; }
    if (drawRig(z.rig.ctx, z.rig.key, z.rig.mode, z.t, opt)) z.rig.tex.needsUpdate = true; return; }
  const pl = z.hero.plane, sp = z.sprite, t = z.t, ph = sp.height, fx = sp.flip ? -1 : 1, base = ph/2, sw = REDUCED ? .3 : 1;
  pl.position.set(sp.dx || 0, base, 0); pl.rotation.z = 0; pl.scale.set(fx, 1, 1);
  if (z.pose === "walk"){ const s = t*5.2; pl.position.y = base + Math.abs(Math.sin(s))*.035*sw; pl.rotation.z = .016*Math.sin(s/2)*sw; pl.position.x += .025*Math.sin(s/2)*sw; }
  else if (z.pose === "fly"){ pl.rotation.z = (sp.tilt || 0) + .035*Math.sin(t*1.1)*sw; pl.position.x += .06*Math.sin(t*.8)*sw; }
  else if (z.pose === "drive"){ const v = Math.abs(z.speed || 0), a = z.acc || 0;
    z.lean = (z.lean || 0) + ((Math.max(-.12, Math.min(.12, a*.02))) - (z.lean || 0))*.12;
    pl.rotation.z = z.lean + .01*Math.sin(t*1.3)*sw; pl.position.y = base + (v > .2 ? Math.sin(t*15)*.012 : Math.sin(t*1.6)*.004)*sw; pl.position.x -= z.lean*.1; }
  else if (z.pose === "cheer"){ pl.position.y = base + Math.abs(Math.sin(t*1.8))*.03*sw; pl.scale.y = 1 + .006*Math.sin(t*1.7); }
  else { pl.scale.y = 1 + .007*Math.sin(t*1.7)*sw; pl.position.y = base*(1 + .007*Math.sin(t*1.7)*sw); pl.rotation.z = .006*Math.sin(t*.45)*sw; }
}
function renderZone(z, dt, target){
  applyEnv(z); zoneCam(z, dt);
  if (!z.robot){ z.hero.group.getWorldPosition(wp); z.hero.group.rotation.y = Math.atan2(camera.position.x - wp.x, camera.position.z - wp.z); }
  skyRig.position.copy(camera.position);
  renderer.setRenderTarget(target); renderer.render(scene, camera);
}
function resize(){
  const w = innerWidth, h = innerHeight; mobile = w <= 820;
  renderer.setSize(w, h, false); camera.aspect = w/h; camera.fov = mobile ? 52 : 40;
  camera.setViewOffset(w, h, mobile ? 0 : w*.13, mobile ? h*.17 : 0, w, h); camera.updateProjectionMatrix();
  const s = new THREE.Vector2(); renderer.getDrawingBufferSize(s);
  if (rtA){ rtA.setSize(s.x, s.y); rtB.setSize(s.x, s.y); } else { rtA = makeRT(s.x, s.y); rtB = makeRT(s.x, s.y); }
  if (post) post.mat.uniforms.aspect.value = w/h;

let T0 = 0, last = 0;
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last)/1000 || 0); last = now; T0 += dt;
  smx += (mx - smx)*Math.min(1, dt*2.5); smy += (my - smy)*Math.min(1, dt*2.5);
  if (!trans){ const z = ZONES[zi]; tickZone(z, dt); renderZone(z, dt, null); return; }
  trans.p = Math.min(1, trans.p + dt/TRANS_DUR);
  const A = ZONES[trans.from], B = ZONES[trans.to];
  tickZone(A, dt); tickZone(B, dt);
  renderZone(A, dt, rtA); renderZone(B, dt, rtB);
  const u = post.mat.uniforms; u.tA.value = rtA.texture; u.tB.value = rtB.texture; u.p.value = easeInOut(trans.p); u.time.value = T0; u.dirX.value = trans.to > trans.from ? 1 : -1;
  renderer.setRenderTarget(null); renderer.render(post.scene, post.cam);
  if (trans.p >= 1){ zi = trans.to; trans = null; applyEnv(ZONES[zi]); const q = queued; queued = null; if (q !== null && q !== cur) go(q); }
}

/* ---- nav + panel ---- */
function buildNav(){
  nav.innerHTML = SECTIONS[lang].map((s, i) => `<button data-i="${i}" class="${i === cur ? "on" : ""}" ${i === cur ? 'aria-current="true"' : ""}><i>0${i+1}</i><span class="bar"></span>${s}</button>`).join("");
  const on = nav.querySelector(".on"); if (on && mobile && on.scrollIntoView) on.scrollIntoView({inline:"center", block:"nearest", behavior:"smooth"});
}
function fitTitle(){
  const h = panel.querySelector("h1,h2"); if (!h) return; h.style.fontSize = "";
  let fs = parseFloat(getComputedStyle(h).fontSize), n = 0; while (h.scrollWidth > panel.clientWidth + 1 && fs > 30 && n++ < 40){ fs -= 3; h.style.fontSize = fs + "px"; }
}
function renderPanel(reveal){
  panel.classList.remove("in", "out");
  panel.innerHTML = view(cur); panel.scrollTop = 0; fitTitle();
  if (cur === 4){ drawPreview(); if (renderer) setProjectScreen(); }
  if (reveal){ void panel.offsetWidth; panel.classList.add("in"); }
}
let panelTimer = null;
function go(i){
  i = Math.max(0, Math.min(6, i));
  if (trans){ queued = i; return; }
  if (i === cur) return;
  prev = cur; cur = i; buildNav();
  clearTimeout(panelTimer);
  panel.classList.remove("in"); panel.classList.add("out");
  panelTimer = setTimeout(() => renderPanel(true), REDUCED ? 120 : 640);
  if (!renderer) return;
  enterCam(ZONES[i]); ZONES[zi].exitT = 0;
  if (i === 3) setJobSign(JOBS[lang][jobI].n, false);
  trans = {from:zi, to:i, p:0};
}
function setLang(l){
  lang = l; document.documentElement.lang = l === "pt" ? "pt-BR" : "en";
  document.getElementById("pt").classList.toggle("on", l === "pt"); document.getElementById("en").classList.toggle("on", l === "en");
  document.getElementById("sub").textContent = T[l].role; document.getElementById("hint").textContent = T[l].hint;
  buildNav(); renderPanel(true); if (renderer && ZONES[3].g) repaintSigns();
}
function stepJob(d, set){ jobI = set !== undefined ? set : (jobI + d + JOBS[lang].length) % JOBS[lang].length; renderPanel(true); if (renderer) setJobSign(JOBS[lang][jobI].n, true); }
function stepProj(d, set){ projI = set !== undefined ? set : (projI + d + PROJ[lang].length) % PROJ[lang].length; renderPanel(true); }

nav.addEventListener("click", e => { const b = e.target.closest("button[data-i]"); if (b) go(+b.dataset.i); });
panel.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return; const d = b.dataset;
  if (d.go) go(+d.go);
  else if (d.back !== undefined) go(prev === cur ? 0 : prev);
  else if (d.job) stepJob(+d.job); else if (d.jobset) stepJob(0, +d.jobset);
  else if (d.proj) stepProj(+d.proj); else if (d.projset) stepProj(0, +d.projset);
  else if (d.copy){
    const done = () => { b.textContent = T[lang].copied; setTimeout(() => { b.textContent = T[lang].copy; }, 1500); };
    const sel = () => { const a = b.parentElement.querySelector("a"); if (!a) return; const r = document.createRange(); r.selectNodeContents(a); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
    try { navigator.clipboard.writeText(d.copy).then(done, sel); } catch (err) { sel(); }
  }
});
document.getElementById("pt").onclick = () => setLang("pt");
document.getElementById("en").onclick = () => setLang("en");
addEventListener("keydown", e => {
  if (e.key === "ArrowDown" || e.key === "PageDown"){ e.preventDefault(); go(cur + 1); }
  else if (e.key === "ArrowUp" || e.key === "PageUp"){ e.preventDefault(); go(cur - 1); }
  else if (e.key === "Home") go(0); else if (e.key === "End") go(6);
  else if (e.key === "Escape") go(prev === cur ? 0 : prev);
  else if (e.key === "ArrowRight" || e.key === "ArrowLeft"){ const d = e.key === "ArrowRight" ? 1 : -1; if (cur === 3) stepJob(d); else if (cur === 4) stepProj(d); }
});
let lastWheel = 0;
addEventListener("wheel", e => {
  if (e.target.closest && e.target.closest("#panel") && panel.scrollHeight > panel.clientHeight + 4){
    const atTop = panel.scrollTop <= 0, atEnd = panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 2;
    if (!((e.deltaY > 0 && atEnd) || (e.deltaY < 0 && atTop))) return;
  }
  const n = performance.now(); if (Math.abs(e.deltaY) < 10 || n - lastWheel < 1300) return;
  lastWheel = n; go(cur + (e.deltaY > 0 ? 1 : -1));
}, {passive:true});
let ty = null;
addEventListener("touchstart", e => { ty = e.target.closest("#panel, nav") ? null : e.touches[0].clientY; }, {passive:true});
addEventListener("touchend", e => { if (ty === null) return; const dy = ty - e.changedTouches[0].clientY; ty = null; if (Math.abs(dy) > 60) go(cur + (dy > 0 ? 1 : -1)); }, {passive:true});
addEventListener("pointermove", e => { mx = (e.clientX/innerWidth - .5)*2; my = (e.clientY/innerHeight - .5)*2; }, {passive:true});

/* ---- boot ---- */
function boot(){
  setLang("pt");
  if (renderer){
    ZONES.forEach(buildZone); initPost();
    addEventListener("resize", resize); resize();
    zi = 0; applyEnv(ZONES[0]); enterCam(ZONES[0]); setJobSign(JOBS[lang][jobI].n, false);
    requestAnimationFrame(t => { last = t; frame(t); requestAnimationFrame(() => { loadEl.classList.add("done"); renderPanel(true); }); });
  } else {
    canvas.style.display = "none"; const f = document.createElement("div"); f.className = "fallback"; document.body.prepend(f); loadEl.classList.add("done");
  }
}
const fontsReady = document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1800))]) : Promise.resolve();
fontsReady.then(() => { try { boot(); } catch (err) { console.error(err); loadEl.classList.add("done"); } });
